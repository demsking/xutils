# You can override the included template(s) by including variable overrides
# See https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
image: node:16.1.0-alpine3.13

stages:
  - test
  - dependencies
  - security
  - sast
  - build

code quality:
  stage: test
  only:
    - merge_requests
  script:
    - yarn install --ignore-scripts
    - yarn add --dev eslint eslint-formatter-gitlab
    - npx eslint --format gitlab .
  artifacts:
    reports:
      codequality: gl-codequality.json

api tests:
  stage: test
  only:
    - merge_requests
  script:
    - yarn global add jest@26.6.3 typescript@4.2.3
    - yarn install
    - cd packages/core && yarn install
    - cd ../services/api && yarn test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

auth tests:
  stage: test
  only:
    - merge_requests
  script:
    - yarn global add jest@26.6.3 typescript@4.2.3
    - yarn install
    - cd packages/core && yarn install
    - cd ../services/auth && yarn test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

dependencies:
  stage: dependencies
  only:
    - merge_requests
  script:
    - yarn install
    - yarn outdated
  allow_failure: true

audit:
  stage: security
  only:
    - merge_requests
  script:
    - yarn audit --production

sast:
  stage: sast

build:
  stage: build
  only:
    - merge_requests
  script:
    - npm i -g lerna
    - lerna bootstrap
    - lerna run build

include:
  - template: Security/SAST.gitlab-ci.yml
